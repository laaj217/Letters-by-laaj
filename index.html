<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>21 Letters for 21 Years</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7f9;
      color: #684d57;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 70px 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 18px 0 55px;
      font-size: 20px;
      font-style: italic;
      color: #96747f;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .letter {
      min-height: 135px;
      border: 1px solid #eadde1;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-size: 21px;
      color: #765b64;
      box-shadow: 0 5px 20px rgba(100, 70, 80, 0.04);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .letter.unlocked {
      cursor: pointer;
      background: #ffffff;
    }

    .letter.unlocked:hover {
      transform: translateY(-3px);
      background: #fffafb;
    }

    .letter.open {
      grid-column: 1 / -1;
      flex-direction: column;
      cursor: default;
      padding: 40px;
    }

    .letter.open:hover {
      transform: none;
    }

    .letter-text {
      max-width: 850px;
      line-height: 1.8;
      font-size: 19px;
      text-align: left;
      white-space: pre-wrap;
    }

    audio {
      width: min(500px, 100%);
      margin-top: 30px;
    }

    @media (max-width: 750px) {
      .container {
        padding-top: 45px;
      }

      .letters {
        grid-template-columns: 1fr;
      }

      .letter {
        min-height: 105px;
      }

      .letter.open {
        grid-column: auto;
        padding: 25px;
      }

      .letter-text {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>21 Letters for 21 Years</h1>

    <p class="subtitle">
      A letter for every year of you.
    </p>

    <div class="letters" id="letters"></div>

  </main>

  <script>

    /*
      Day 1 unlocks:
      26 July 2026 at 12:00 AM Pakistan time.

      Every following day unlocks at
      12:00 AM Pakistan time.

      Once a day unlocks, it stays
      unlocked permanently.
    */

    const firstUnlock = Date.UTC(2026, 6, 25, 19, 0, 0);

    const oneDay = 24 * 60 * 60 * 1000;

    const lettersContainer =
      document.getElementById("letters");


    /*
      LETTERS + SONGS
    */

    const letterData = {

      1: {

        text: `Happy birthday baby, i know you said i cant spend money on gifts so obviously i had to come up with other ways to show how much this day, and you, mean to me, so in this portal im gonna write 21 letters to you, 1 for every year since you were born cause i need to make up for all the birthday i have missed. And with every letter I'm gonna put a song that reminds me of us. And because today is your birthday I want to make sure everything feels special cause it really is that important huh. I know I'm not perfect but I genuinely wanna be when it comes to you cause you’re perfect to me and even if you think you’re not, I don't care because you're my home. I promise I'll always stay by your side and be right here whenever you need me. I’ll always put you before everyone else and do anything just to put a smile on your face cause that’s my favourite thing in the whole world. This last year we have gotten even closer in so many ways and it was the best year ever and I know inshallah the coming year is also gonna bring so many great things into your life, and I definitely need to find more ways to annoy you😋and more things to put on our bucket list.`,

        song: "har-baar.mp3"

      },

      2: {

        text: `Hey, if youre reading this right now then it means its day 2 of your birthday and there is a 99.999 percent chance that we spent day 1 together and if we did then there is a 10000 percent chance that it was the cutest day ever cause how can it not be when youre there with me and i can already imagine myself missing your presence and your smile after i get back home. Its actually so unfair how quickly i start missing you when ive literally just seen you. Like somehow spending an entire day with you only makes me want another one. I hope yesterday made you feel even a fraction of how loved and special you are to me, because seeing you happy is genuinely one of my favourite things ever.

And the best part is that your birthday still isnt over, so unfortunately for you, neither is me being unbearably obsessed with making you feel special. Happy day 2, pretty boy. I hope you know id choose a day with you over almost anything, every single time. I love you to the moon and back`,

        song: "rakhlo-tum-chupaake.mp3"

      }

    };


    function createLetters() {

      const now = Date.now();

      lettersContainer.innerHTML = "";


      for (let day = 1; day <= 21; day++) {

        const unlockTime =
          firstUnlock + ((day - 1) * oneDay);

        const unlocked =
          now >= unlockTime;

        const card =
          document.createElement("div");


        /*
          LOCKED DAY
        */

        if (!unlocked) {

          card.className = "letter";

          card.innerHTML =
            `🔒 Day ${day}`;

        }


        /*
          UNLOCKED DAY
        */

        else {

          card.className =
            "letter unlocked";

          card.innerHTML =
            `💌 Day ${day}`;

          const data =
            letterData[day];


          if (data) {

            card.addEventListener(
              "click",
              () => {

                card.classList.add("open");

                card.innerHTML = `
                  <div class="letter-text">
                    ${data.text}
                  </div>

                  <audio controls preload="metadata">
                    <source
                      src="${data.song}"
                      type="audio/mpeg"
                    >
                    Your browser does not support audio.
                  </audio>
                `;

              },
              { once: true }
            );

          }

        }


        lettersContainer.appendChild(card);

      }

    }


    createLetters();


    /*
      Check every 30 seconds for
      the next midnight unlock.

      Previously unlocked letters
      always remain unlocked.
    */

    let lastUnlockedDay =
      Math.max(
        0,
        Math.min(
          21,
          Math.floor(
            (Date.now() - firstUnlock) / oneDay
          ) + 1
        )
      );


    setInterval(() => {

      const currentUnlockedDay =
        Math.max(
          0,
          Math.min(
            21,
            Math.floor(
              (Date.now() - firstUnlock) / oneDay
            ) + 1
          )
        );


      if (
        currentUnlockedDay !== lastUnlockedDay &&
        !document.querySelector(".letter.open")
      ) {

        lastUnlockedDay = currentUnlockedDay;

        createLetters();

      }

    }, 30000);

  </script>

</body>
</html>
