<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 Letters for 21 Years</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7f9;
      color: #684d57;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 70px 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 18px 0 55px;
      font-size: 20px;
      font-style: italic;
      color: #96747f;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .letter {
      min-height: 135px;
      border: 1px solid #eadde1;
      border-radius: 20px;
      background: rgba(255,255,255,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      color: #765b64;
      box-shadow: 0 5px 20px rgba(100, 70, 80, 0.04);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .letter.unlocked {
      cursor: pointer;
      background: #ffffff;
    }

    .letter.unlocked:hover {
      transform: translateY(-3px);
      background: #fffafb;
    }

    .lock {
      margin-right: 8px;
    }

    @media (max-width: 750px) {
      .container {
        padding-top: 45px;
      }

      .letters {
        grid-template-columns: 1fr;
      }

      .letter {
        min-height: 105px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>21 Letters for 21 Years</h1>
    <p class="subtitle">A letter for every year of you.</p>

    <div class="letters" id="letters"></div>
  </main>

  <script>
    /*
      Day 1 unlocks:
      26 July 2026 at 12:00 AM Pakistan Standard Time (UTC+5)

      This is 25 July 2026 at 7:00 PM UTC.
    */

    const firstUnlock = Date.UTC(2026, 6, 25, 19, 0, 0);

    const lettersContainer = document.getElementById("letters");

    function createLetters() {
      const now = Date.now();
      const oneDay = 24 * 60 * 60 * 1000;

      for (let day = 1; day <= 21; day++) {
        const unlockTime = firstUnlock + ((day - 1) * oneDay);
        const unlocked = now >= unlockTime;

        const card = document.createElement("div");
        card.className = unlocked ? "letter unlocked" : "letter";

        if (unlocked) {
          card.innerHTML = `💌 Day ${day}`;
        } else {
          card.innerHTML = `<span class="lock">🔒</span> Day ${day}`;
        }

        lettersContainer.appendChild(card);
      }
    }

    createLetters();

    /*
      Refresh automatically when a locked day reaches
      its unlock time, so the user doesn't need to reload.
    */

    setInterval(() => {
      lettersContainer.innerHTML = "";
      createLetters();
    }, 30000);
  </script>

</body>
</html>
