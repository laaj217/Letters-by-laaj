<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>21 Letters for 21 Years</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7f9;
      color: #684d57;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 70px 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 18px 0 55px;
      font-size: 20px;
      font-style: italic;
      color: #96747f;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .letter {
      min-height: 135px;
      border: 1px solid #eadde1;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-size: 21px;
      color: #765b64;
      box-shadow: 0 5px 20px rgba(100, 70, 80, 0.04);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .letter.unlocked {
      cursor: pointer;
      background: #ffffff;
    }

    .letter.unlocked:hover {
      transform: translateY(-3px);
      background: #fffafb;
    }

    .letter.open {
      grid-column: 1 / -1;
      flex-direction: column;
      cursor: default;
      padding: 40px;
    }

    .letter-text {
      max-width: 850px;
      line-height: 1.8;
      font-size: 19px;
      text-align: left;
      white-space: pre-wrap;
    }

    audio {
      width: min(500px, 100%);
      margin-top: 30px;
    }

    @media (max-width: 750px) {
      .container {
        padding-top: 45px;
      }

      .letters {
        grid-template-columns: 1fr;
      }

      .letter {
        min-height: 105px;
      }

      .letter.open {
        grid-column: auto;
        padding: 25px;
      }

      .letter-text {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>21 Letters for 21 Years</h1>

    <p class="subtitle">
      A letter for every year of you.
    </p>

    <div class="letters" id="letters"></div>

  </main>

  <script>

    const lettersContainer = document.getElementById("letters");

    const letterData = {

      1: {

        text: `Happy birthday baby, i know you said i cant spend money on gifts so obviously i had to come up with other ways to show how much this day, and you, mean to me, so in this portal im gonna write 21 letters to you, 1 for every year since you were born cause i need to make up for all the birthday i have missed. And with every letter I'm gonna put a song that reminds me of us. And because today is your birthday I want to make sure everything feels special cause it really is that important huh. I know I'm not perfect but I genuinely wanna be when it comes to you cause you’re perfect to me and even if you think you’re not, I don't care because you're my home. I promise I'll always stay by your side and be right here whenever you need me. I’ll always put you before everyone else and do anything just to put a smile on your face cause that’s my favourite thing in the whole world. This last year we have gotten even closer in so many ways and it was the best year ever and I know inshallah the coming year is also gonna bring so many great things into your life, and I definitely need to find more ways to annoy you😋and more things to put on our bucket list.`,

        song: "har-baar.mp3"

      }

    };


    function createLetters() {

      for (let day = 1; day <= 21; day++) {

        const card = document.createElement("div");

        /*
          TEST MODE:
          Day 1 is unlocked immediately.
          Days 2-21 remain locked.
        */

        const unlocked = day === 1;

        if (!unlocked) {

          card.className = "letter";
          card.innerHTML = `🔒 Day ${day}`;

        } else {

          card.className = "letter unlocked";
          card.innerHTML = `💌 Day ${day}`;

          const data = letterData[day];

          if (data) {

            card.addEventListener("click", () => {

              card.classList.add("open");

              card.innerHTML = `
                <div class="letter-text">${data.text}</div>

                <audio controls>
                  <source src="${data.song}" type="audio/mpeg">
                  Your browser does not support audio.
                </audio>
              `;

            });

          }

        }

        lettersContainer.appendChild(card);

      }

    }

    createLetters();

  </script>

</body>
</html>
