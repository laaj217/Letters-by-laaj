<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>21 Letters for 21 Years</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #fff7f9;
        font-family: Georgia, serif;
        color: #3d3034;
        padding: 60px 20px;
    }

    .container {
        max-width: 850px;
        margin: auto;
    }

    h1 {
        text-align: center;
        font-size: 48px;
        font-weight: normal;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        font-style: italic;
        color: #8c747c;
        margin-bottom: 50px;
        font-size: 18px;
    }

    .letters {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .letter {
        height: 130px;
        border: none;
        border-radius: 18px;
        font-family: Georgia, serif;
        font-size: 20px;
        transition: 0.25s;
    }

    .unlocked {
        background: white;
        color: #3d3034;
        cursor: pointer;
        box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .unlocked:hover {
        transform: translateY(-4px);
    }

    .locked {
        background: #eadfe2;
        color: #9c8e93;
        cursor: not-allowed;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 38px;
        }

        .letters {
            grid-template-columns: repeat(2, 1fr);
        }

        .letter {
            height: 110px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>21 Letters for 21 Years</h1>

    <p class="subtitle">
        A letter for every year of you.
    </p>

    <div class="letters" id="letters"></div>

</div>


<script>

const NUMBER_OF_LETTERS = 21;

/*
Day 1 unlocks:
26 July 2026
12:00 AM Pakistan Standard Time

Pakistan = UTC + 5
Therefore midnight in Pakistan = 19:00 UTC on 25 July.
*/

const FIRST_UNLOCK =
    new Date("2026-07-25T19:00:00Z").getTime();

const ONE_DAY = 24 * 60 * 60 * 1000;

const container = document.getElementById("letters");

for (let i = 1; i <= NUMBER_OF_LETTERS; i++) {

    const unlockTime =
        FIRST_UNLOCK + ((i - 1) * ONE_DAY);

    const button = document.createElement("button");

    button.classList.add("letter");

    const now = Date.now();

    if (now >= unlockTime) {

        button.classList.add("unlocked");
        button.innerHTML = "Day " + i + " ♡";

        button.onclick = function () {
            window.location.href = "letter" + i + ".html";
        };

    } else {

        button.classList.add("locked");
        button.innerHTML = "🔒 Day " + i;

        button.onclick = function () {

            const date =
                new Date(unlockTime);

            alert(
                "This letter isn't ready to be opened yet ♡"
            );
        };
    }

    container.appendChild(button);
}

</script>

</body>
</html>
