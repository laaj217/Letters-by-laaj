<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>21 Letters for 21 Years</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7f9;
      color: #684d57;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 70px 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 18px 0 55px;
      font-size: 20px;
      font-style: italic;
      color: #96747f;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .letter {
      min-height: 135px;
      border: 1px solid #eadde1;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-size: 21px;
      color: #765b64;
      box-shadow: 0 5px 20px rgba(100, 70, 80, 0.04);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .letter.unlocked {
      cursor: pointer;
      background: #ffffff;
    }

    .letter.unlocked:hover {
      transform: translateY(-3px);
      background: #fffafb;
    }

    .letter.open {
      grid-column: 1 / -1;
      flex-direction: column;
      cursor: default;
      padding: 40px;
    }

    .letter.open:hover {
      transform: none;
    }

    .letter-text {
      max-width: 850px;
      line-height: 1.8;
      font-size: 19px;
      text-align: left;
      white-space: pre-wrap;
    }

    audio {
      width: min(500px, 100%);
      margin-top: 30px;
    }

    @media (max-width: 750px) {
      .container {
        padding-top: 45px;
      }

      .letters {
        grid-template-columns: 1fr;
      }

      .letter {
        min-height: 105px;
      }

      .letter.open {
        grid-column: auto;
        padding: 25px;
      }

      .letter-text {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>21 Letters for 21 Years</h1>

    <p class="subtitle">
      A letter for every year of you.
    </p>

    <div class="letters" id="letters"></div>

  </main>

  <script>

    /*
      Day 1 unlocks:
      26 July 2026 at 12:00 AM Pakistan time.

      Day 2:
      27 July 2026 at 12:00 AM Pakistan time.

      Day 3:
      28 July 2026 at 12:00 AM Pakistan time.

      Every following day unlocks at
      12:00 AM Pakistan time.

      Once a day unlocks, it stays
      unlocked permanently.
    */

    const firstUnlock = Date.UTC(2026, 6, 25, 19, 0, 0);

    const oneDay = 24 * 60 * 60 * 1000;

    const lettersContainer =
      document.getElementById("letters");


    /*
      LETTERS + SONGS
    */

    const letterData = {

      1: {

        text: `Happy birthday baby, i know you said i cant spend money on gifts so obviously i had to come up with other ways to show how much this day, and you, mean to me, so in this portal im gonna write 21 letters to you, 1 for every year since you were born cause i need to make up for all the birthday i have missed. And with every letter I'm gonna put a song that reminds me of us. And because today is your birthday I want to make sure everything feels special cause it really is that important huh. I know I'm not perfect but I genuinely wanna be when it comes to you cause you’re perfect to me and even if you think you’re not, I don't care because you're my home. I promise I'll always stay by your side and be right here whenever you need me. I’ll always put you before everyone else and do anything just to put a smile on your face cause that’s my favourite thing in the whole world. This last year we have gotten even closer in so many ways and it was the best year ever and I know inshallah the coming year is also gonna bring so many great things into your life, and I definitely need to find more ways to annoy you😋and more things to put on our bucket list.`,

        song: "har-baar.mp3"

      },

      2: {

        text: `Hey, if youre reading this right now then it means its day 2 of your birthday and there is a 99.999 percent chance that we spent day 1 together and if we did then there is a 10000 percent chance that it was the cutest day ever cause how can it not be when youre there with me and i can already imagine myself missing your presence and your smile after i get back home. Its actually so unfair how quickly i start missing you when ive literally just seen you. Like somehow spending an entire day with you only makes me want another one. I hope yesterday made you feel even a fraction of how loved and special you are to me, because seeing you happy is genuinely one of my favourite things ever.

And the best part is that your birthday still isnt over, so unfortunately for you, neither is me being unbearably obsessed with making you feel special. Happy day 2, pretty boy. I hope you know id choose a day with you over almost anything, every single time. I love you to the moon and back`,

        song: "rakhlo-tum-chupaake.mp3"

      },

      3: {

        text: `Okay so its officially day 3😋😋and since ive already spent the first two telling you how much i love you, i thought today id tell you about one of my favourite things about us, which is how, somehow even the most normal things feel better when youre there. Like i dont think you realise how many random moments throughout my day make me think of you. Ill hear something stupid and immediately think about how i need to tell you, or see something youd like and mentally save it for later when we call, or something will happen and before i even properly process it im already thinking about what youre gonna say when i tell you. Youve somehow made yourself a part of all the tiny little corners of my life without even trying.

And i think thats one of the things i love most about having you. not only the big dates or the crazy plan like I could genuinely be doing the most boring thing in the world and if youre next to me, id probably still rather be there than anywhere else. I hope you know how much i love having you in my life, not just as the person i love but as my best friend to tell everything to, laugh with, bother, miss five minutes after seeing, and apparently write 21 letters for. You make my normal days feel a little less normal just by being in them. I love you to the moon and back🌙💛`,

        song: "bairan.mp3"

      },

      4: {

        text: `Day 4 it is 💪🏻 and you must be thinking, what could she possibly have left to say? But trustttt me, i could spend an eternity yapping about you and somehow id still have more to tell you😋😋

I dont think ive ever told you this properly, but youre the one person who makes me feel safe enough to let all my guards down. The version of me that most people know is always trying to have everything figured out, always pretending to be stronger than she probably is. But with you, i dont feel like i have to carry any of that. I get to be SOFT, i get to be dramatic, clingy, a little childish, and somehow you never make me feel like im too much. You just make me feel safe enough to simply be. And i think thats my favourite gift youve ever given me.

You bring out the side of me that i didnt even know i was capable of being. The side that isnt worried about having all the answers, because deep down she knows that if youre beside her, everything will be okay. Youve become the kind of home i never knew i was searching for, and i hope you never forget how grateful i am for that.

I genuinely never have to think twice before saying anything. I never have to hide my emotions because i know im with my Fardeen, who will always, always make everything okay. When im with you, i dont have to be anything other than your sweet little girl, and thats my favourite thing to be. Thank you for always being my rock💗

I love you to the moon and back🌙`,

        song: "cant-help-falling-in-love.mp3"

      },
      5: {

  text: `Youre always telling me not to do too much. Not to go overboard. Not to say things like “id bring you the moon if you asked for it”. And i know why you say it. I know you dont need grand gestures to know youre loved. But what am i supposed to do when the person in question is you?

How do i explain that loving you has never felt like an effort? It feels like the most natural thing ive ever done. So when i dream of giving you everything in my capacity, its not because i think you expect it from me. Its because somehow nothing i could ever give you feels big enough compared to everything youve unknowingly given me. Even if i really did place the moon in your hands, id probably still be sitting there thinking….that maybe even the moon isnt good enough for my Fardeen. Maybe i can do something better. Because how could i ever feel like its enough when it comes to you, to the one person who showed me what love really feels like.

So if i seem a little extra sometimes, if i keep finding new ways to celebrate you, or make ordinary days feel a little more special, i hope youll forgive me cause i know u get a lil mad when i do too much, but even if you do then its fine i even love that about you. Thats just how my heart loves you. It keeps looking for new ways to say thank you for existing, even though i know no gesture could ever truly measure up to what you mean to me.

تم کو آتا ہے پیار پر غصہ
مجھ کو غصے پہ پیار آتا ہے

I love you to the moon and back meri jaan💗`,

  song: "ek-din-aap.mp3"

},

6: {

  text: `You know whats actually funny? Before you, i genuinely never imagined id be the kind of person who would happilyy stand in a kitchen in the middle of june, just to bake brownies for someone 😭 cause i thought id never even get up to get water if its too hot outside. Id never thought id be spending hours making little surprises, writing letters, or getting ridiculously excited over the thought of making one person smile. If you had told me a few years ago that id be doing all this, i probably wouldve laughed in your face.

And then theres all the little things that quietly changed without me even noticing. Every time im getting ready, somehow youre the only person on my mind. I catch myself wondering if youll like this colour im wearing, if youll notice this little detail, if youll smile when i send you my picture. Suddenly im paying attention to the tiniest things, because at the end of the day, i dont really care who else sees me. The only eyes i secretly hope notice me are yours, and your eyes are the only eyes i wanna be seen by, and somehow none of it ever feels like im going out of my way. It just feels natural.

I think thats what loving you has done to me. It turned things i never imagined myself doing into the easiest things in the world. Because when its for you, nothing feels like too much. If theres even the smallest chance that something will make you smile, ill probably do it without thinking twice. And honestly, i hope i never stop being this version of myself, because shes only here because you are, and she loves you to the moon and back🌻`,

  song: "kammo-ji.mp3"

    },
      7: {

  text: `Today it is 🤍

Today i wanna talk about all the little things you probably dont even realise you do. The things that seem so normal to you that youd probably laugh if i pointed them out. Like how i dont think theres been a single night in the last three years where youve forgotten to tell me goodnight. And every single time, without fail, you ask me to text you if i need anything. You probably send that message without thinking twice, but i promise you, ill never read it without smiling. Its such a small thing, yet somehow it always makes me feel looked after.

I love how you notice me. Not just the obvious things, but the quiet ones. You can tell somethings wrong just from the way im talking, or the way my mood shifts ever so slightly. Before i even say anything, youre already asking if im okay, already trying to make me feel better. and that’s something i really adore about you. You care for me in a way that idk how to even explain and that always makes me melt in front of youuu.

And then there are all the other little things. The way youve slowly made me realise i dont always have to be the one figuring everything out. Somewhere along the way, without either of us talking about it, i learned that i could just like, relax. I could let you take the lead, and i never thought that could be the case with me and now i cant imagine myself any other way and thats shocking to me, and thats why i love being your girl, your Lojain.

I love you to the moon and back 🤍`,

  song: "hum.mp3"

},

8: {

  text: `Day 8 it is ⭐

Do you remember that bucket list we made together? I dont think either of us realised just how many little boxes wed actually end up ticking. Looking back now, it makes me smile because somehow youve become the person behind so many of my favourite firsts. My firsts have always felt so sacred to me, and i cant believe i got to share so many of them with you. From coffees over cigarettes while talking about life, to discovering new places to eat, random side quests, long night drives with our favourite songs playing (i know u hate driving but i love annoying you while u do 😋), and all the tiny adventures in between. There are so many moments that i still to this day replay in my head and they still make me smile and blush. All the cute little things we have shared together will always be sacred to me, even if they are as small as feeding u brownies on your lap in Coffee Planet for the first time 😭😭

But the best part is knowing we still have so many more memories waiting for us, and so many more things that we still need to check off our bucket list. The BIGGEST one is being on the mountains together, sitting somewhere in the middle of nowhere, under a sky full of stars, listening to Rockstar ki playlist together, and for a little while the rest of the world will disappear. Ill probably make you maggi after, and youll probably tell me its the best maggi youve ever had even if its terrible 😭 so i apologize for that in advance.

And i already know my favourite part of those days wont be just the places themselves. Itll be that youre there. You could probably take me anywhere, and somehow itd become one of my favourite memories just because youre standing in it and thats how special you are to me and thats how special you make everything around me.

I dont know what the future has planned for us, but i do know one thing. If there are still memories out there waiting to be made, i hope a lot of them have you in them.

I love you to the moon and back 🤍`,

  song: "tum-ho.mp3"

},

9: {

  text: `Todays letter isnt really mine. Every once in a while i come across words that make me stop and think that “this is exactly how i feel”, but i just could never have written it this beautifully. And this ghazal has always been one of those for me. Every time i read it, it somehow makes me think of you.

So today, instead of trying to find my own words, i thought id borrow Faraz Ahmed’s, so here is to you🥂

A ghazal i dedicate to you<3

so rah-ravān-e-tamannā bhī Dar ke dekhte haiñ

makīñ udhar ke bhī jalve idhar ke dekhte haiñ

agar vo ḳhvāb hai tābīr kar ke dekhte haiñ

‘farāz’ aao sitāre safar ke dekhte haiñ`,

  song: "love-legend-theme.mp3"

}
};
    


    function createLetters() {

      const now = Date.now();

      lettersContainer.innerHTML = "";


      for (let day = 1; day <= 21; day++) {

        const unlockTime =
          firstUnlock + ((day - 1) * oneDay);

        const unlocked =
          now >= unlockTime;

        const card =
          document.createElement("div");


        /*
          LOCKED DAY
        */

        if (!unlocked) {

          card.className = "letter";

          card.innerHTML =
            `🔒 Day ${day}`;

        }


        /*
          UNLOCKED DAY
        */

        else {

          card.className =
            "letter unlocked";

          card.innerHTML =
            `💌 Day ${day}`;

          const data =
            letterData[day];


          if (data) {

            card.addEventListener(
              "click",
              () => {

                card.classList.add("open");

                card.innerHTML = `
                  <div class="letter-text">
                    ${data.text}
                  </div>

                  <audio controls preload="metadata">
                    <source
                      src="${data.song}"
                      type="audio/mpeg"
                    >
                    Your browser does not support audio.
                  </audio>
                `;

              },
              { once: true }
            );

          }

        }


        lettersContainer.appendChild(card);

      }

    }


    createLetters();


    /*
      Check every 30 seconds for
      the next midnight unlock.

      Previously unlocked letters
      always remain unlocked.
    */

    let lastUnlockedDay =
      Math.max(
        0,
        Math.min(
          21,
          Math.floor(
            (Date.now() - firstUnlock) / oneDay
          ) + 1
        )
      );


    setInterval(() => {

      const currentUnlockedDay =
        Math.max(
          0,
          Math.min(
            21,
            Math.floor(
              (Date.now() - firstUnlock) / oneDay
            ) + 1
          )
        );


      if (
        currentUnlockedDay !== lastUnlockedDay &&
        !document.querySelector(".letter.open")
      ) {

        lastUnlockedDay = currentUnlockedDay;

        createLetters();

      }

    }, 30000);

  </script>

</body>
</html>
